
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAVEXRO // Roblox Account Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bg: '#0a0b0e',
            surface: '#111318',
            elevated: '#181b22',
            border: '#232732',
            accent: '#7c3aed',
            accentHover: '#6d28d9',
            crimson: '#dc2626',
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #0a0b0e; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    .tabular { font-variant-numeric: tabular-nums; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0a0b0e; }
    ::-webkit-scrollbar-thumb { background: #232732; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #363c4d; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-accent selection:text-white">

  <!-- TOP NAVIGATION -->
  <header class="sticky top-0 z-40 bg-bg/95 backdrop-blur border-b border-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="#/" class="flex items-center gap-2.5 font-mono font-semibold tracking-tight text-white">
        <span class="w-7 h-7 bg-accent/15 border border-accent/40 rounded flex items-center justify-center text-accent">
          <i data-lucide="shield" class="w-4 h-4"></i>
        </span>
        <span>KAVEXRO</span>
        <span class="text-[11px] px-1.5 py-0.5 rounded bg-elevated border border-border text-zinc-400">LIVE</span>
      </a>

      <nav class="hidden md:flex items-center gap-6 text-sm text-zinc-400">
        <a href="#/" class="hover:text-white transition">Home</a>
        <a href="#/marketplace" class="hover:text-white transition">Marketplace</a>
        <a href="#/faq" class="hover:text-white transition">FAQ</a>
        <a href="#/support" class="hover:text-white transition">Support</a>
        <a href="#/admin" class="text-amber-400/90 hover:text-amber-300 transition flex items-center gap-1.5 font-medium">
          <i data-lucide="lock" class="w-3.5 h-3.5"></i> Admin Panel
        </a>
      </nav>

      <div class="flex items-center gap-2.5" id="nav-actions"></div>
    </div>
  </header>

  <!-- MAIN ROUTER OUTLET -->
  <main id="app" class="flex-1"></main>

  <!-- FOOTER -->
  <footer class="border-t border-border bg-surface mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-zinc-500">
      <div class="flex items-center gap-2 font-mono">
        <span class="text-zinc-300 font-semibold">KAVEXRO</span>
        <span>• 2026 </span>
      </div>
      <div class="flex items-center gap-6">
        <a href="#/marketplace" class="hover:text-zinc-300">Catalog</a>
        <a href="#/faq" class="hover:text-zinc-300">FAQ</a>
        <a href="#/support" class="hover:text-zinc-300">Support</a>
        <a href="#/admin" class="hover:text-zinc-300">Admin</a>
      </div>
    </div>
  </footer>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <script>
    const state = {
      listings: [],
      user: null,
      userToken: localStorage.getItem('kvx_user_token') || '',
      adminToken: sessionStorage.getItem('kvx_admin_token') || '',
      cart: JSON.parse(localStorage.getItem('kvx_cart') || '[]'),
      favorites: JSON.parse(localStorage.getItem('kvx_favs') || '[]'),
      filters: { search: '', category: 'All', minPrice: '', maxPrice: '', minRobux: 0, sort: 'newest' }
    };

    function renderAvatarSVG(preset = 'dominus', seed = 'KVX') {
      const palettes = {
        dominus: { bg: '#161421', accent: '#7c3aed', trim: '#c4b5fd' },
        valkyrie: { bg: '#1c1518', accent: '#dc2626', trim: '#fca5a5' },
        fedora: { bg: '#131b1e', accent: '#0284c7', trim: '#7dd3fc' },
        classic: { bg: '#1b1914', accent: '#d97706', trim: '#fcd34d' },
        headless: { bg: '#17171c', accent: '#52525b', trim: '#e4e4e7' }
      };
      const p = palettes[preset] || palettes.dominus;
      return `
        <svg viewBox="0 0 200 200" class="w-full h-full object-cover" xmlns="http://www.w3.org/2000/svg">
          <rect width="200" height="200" fill="${p.bg}"/>
          <g stroke="#262936" stroke-width="1">
            <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
            <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
            <line x1="40" y1="0" x2="40" y2="200"/><line x1="100" y1="0" x2="100" y2="200"/>
            <line x1="160" y1="0" x2="160" y2="200"/>
          </g>
          <rect x="68" y="96" width="64" height="68" rx="4" fill="#232734" stroke="${p.accent}" stroke-width="2"/>
          <rect x="42" y="98" width="22" height="60" rx="3" fill="#1c1f2a" stroke="#34394c" stroke-width="1.5"/>
          <rect x="136" y="98" width="22" height="60" rx="3" fill="#1c1f2a" stroke="#34394c" stroke-width="1.5"/>
          ${preset === 'headless'
            ? `<circle cx="100" cy="68" r="8" fill="none" stroke="${p.trim}" stroke-dasharray="3 3"/>`
            : `<rect x="76" y="42" width="48" height="46" rx="8" fill="#2a2f3f" stroke="${p.trim}" stroke-width="2"/>
               <path d="M70 54 L100 32 L130 54 L124 88 L76 88 Z" fill="${p.accent}" fill-opacity="0.35" stroke="${p.trim}" stroke-width="1.5"/>
               <rect x="86" y="62" width="8" height="4" rx="1" fill="${p.trim}"/>
               <rect x="106" y="62" width="8" height="4" rx="1" fill="${p.trim}"/>`
          }
          <text x="12" y="188" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="10">${seed.toUpperCase()}</text>
        </svg>
      `;
    }

    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      const border = type === 'error' ? 'border-crimson text-red-200' : 'border-accent text-zinc-100';
      el.className = `bg-elevated border ${border} px-4 py-2.5 rounded text-xs font-medium shadow-xl transition-all`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    async function api(url, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (state.userToken) headers['x-user-token'] = state.userToken;
      if (state.adminToken) headers['x-admin-token'] = state.adminToken;
      const res = await fetch(url, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function saveLocal() {
      localStorage.setItem('kvx_cart', JSON.stringify(state.cart));
      localStorage.setItem('kvx_favs', JSON.stringify(state.favorites));
      renderNav();
    }

    function toggleFav(id) {
      if (state.favorites.includes(id)) {
        state.favorites = state.favorites.filter(x => x !== id);
        toast('Removed from watchlist');
      } else {
        state.favorites.push(id);
        toast('Saved to watchlist');
      }
      saveLocal();
      router();
    }

    function addToCart(id) {
      if (state.cart.includes(id)) {
        toast('Already in cart');
        return;
      }
      state.cart.push(id);
      saveLocal();
      toast('Added to cart');
    }

    async function loadListings() {
      state.listings = await api('/api/listings');
    }

    async function loadSession() {
      if (!state.userToken) return;
      try {
        const data = await api('/api/auth/me');
        state.user = data.user;
      } catch {
        state.userToken = '';
        localStorage.removeItem('kvx_user_token');
      }
    }

    function renderNav() {
      const container = document.getElementById('nav-actions');
      container.innerHTML = `
        <a href="#/favorites" class="relative p-2 rounded border border-border bg-surface hover:bg-elevated text-zinc-300" title="Favorites">
          <i data-lucide="heart" class="w-4 h-4"></i>
          ${state.favorites.length ? `<span class="absolute -top-1.5 -right-1.5 bg-accent text-[10px] font-mono px-1 rounded text-white">${state.favorites.length}</span>` : ''}
        </a>
        <a href="#/cart" class="relative p-2 rounded border border-border bg-surface hover:bg-elevated text-zinc-300" title="Cart">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          ${state.cart.length ? `<span class="absolute -top-1.5 -right-1.5 bg-accent text-[10px] font-mono px-1 rounded text-white">${state.cart.length}</span>` : ''}
        </a>
        ${state.user
          ? `<a href="#/dashboard" class="px-3 py-1.5 rounded bg-elevated border border-border hover:border-zinc-600 text-xs font-medium text-white flex items-center gap-1.5">
              <i data-lucide="user" class="w-3.5 h-3.5 text-accent"></i> ${state.user.username}
             </a>`
          : `<a href="#/login" class="px-3 py-1.5 rounded bg-accent hover:bg-accentHover text-xs font-medium text-white">Sign In</a>`
        }
      `;
      lucide.createIcons();
    }

    function listingCard(item) {
      const isFav = state.favorites.includes(item.id);
      const isSold = item.status !== 'available';
      return `
        <div class="bg-surface border border-border hover:border-zinc-700 rounded overflow-hidden flex flex-col transition">
          <div class="relative h-44 bg-elevated border-b border-border">
            ${renderAvatarSVG(item.avatar_preset, item.id)}
            <div class="absolute top-2.5 left-2.5 flex gap-1.5">
              <span class="px-2 py-0.5 text-[11px] font-mono rounded bg-bg/90 border border-border text-zinc-300">${item.category}</span>
              ${item.featured ? `<span class="px-2 py-0.5 text-[11px] font-mono rounded bg-accent/20 border border-accent/50 text-purple-200">FEATURED</span>` : ''}
            </div>
            <button onclick="toggleFav('${item.id}')" class="absolute top-2.5 right-2.5 p-1.5 rounded bg-bg/90 border border-border hover:border-zinc-600 ${isFav ? 'text-crimson' : 'text-zinc-400'}">
              <i data-lucide="heart" class="w-3.5 h-3.5 ${isFav ? 'fill-current' : ''}"></i>
            </button>
            ${isSold ? `<div class="absolute inset-0 bg-bg/80 flex items-center justify-center font-mono text-xs uppercase tracking-wider text-crimson font-semibold">Sold Out</div>` : ''}
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between gap-4">
            <div>
              <div class="flex items-center justify-between text-xs font-mono text-zinc-500 mb-1">
                <span>@${item.roblox_username}</span>
                <span>EST. ${item.join_year}</span>
              </div>
              <h3 class="font-semibold text-sm text-white line-clamp-1">${item.title}</h3>
              <p class="text-xs text-zinc-400 mt-1 line-clamp-2">${item.description}</p>
            </div>
            <div>
              <div class="grid grid-cols-3 gap-2 py-2.5 px-2.5 rounded bg-bg border border-border text-center font-mono text-xs mb-3 tabular">
                <div><div class="text-[10px] text-zinc-500">ROBUX</div><div class="text-zinc-200">${Number(item.robux).toLocaleString()}</div></div>
                <div><div class="text-[10px] text-zinc-500">ITEMS</div><div class="text-zinc-200">${item.item_count}</div></div>
                <div><div class="text-[10px] text-zinc-500">LEVEL</div><div class="text-zinc-200">${item.level}</div></div>
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="font-mono font-semibold text-base text-white tabular">$${Number(item.price).toFixed(2)}</span>
                <a href="#/product/${item.id}" class="px-3 py-1.5 rounded bg-elevated hover:bg-zinc-800 border border-border text-xs font-medium text-white">View Details</a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHome() {
      const available = state.listings.filter(l => l.status === 'available');
      const featured = available.filter(l => l.featured).slice(0, 4);
      const recent = available.slice(0, 4);

      return `
        <section class="border-b border-border bg-surface">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-16 lg:py-20 grid lg:grid-cols-12 gap-10 items-center">
            <div class="lg:col-span-7 space-y-6">
              <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded bg-elevated border border-border text-xs font-mono text-zinc-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> KAVEXRO ONLINE • ${available.length} LIVE LISTINGS
              </div>
              <h1 class="text-3xl sm:text-5xl font-bold tracking-tight text-white leading-tight">
                Your Next Roblox Experience Starts Here.
              </h1>
              <p class="text-zinc-400 text-sm sm:text-base max-w-xl leading-relaxed">
                Verified legacy accounts, rare limited inventories, and high-tier progression backed by persistent backend storage.
              </p>
              <form onsubmit="event.preventDefault(); state.filters.search = this.q.value; location.hash='#/marketplace';" class="flex flex-col sm:flex-row gap-2.5 max-w-xl">
                <input name="q" placeholder="Search by title, limited item, or username..." class="flex-1 bg-bg border border-border focus:border-accent outline-none rounded px-3.5 py-2.5 text-sm text-white" />
                <button type="submit" class="px-5 py-2.5 rounded bg-accent hover:bg-accentHover text-sm font-medium text-white">Search Catalog</button>
                <a href="#/marketplace" class="px-5 py-2.5 rounded bg-elevated hover:bg-zinc-800 border border-border text-sm font-medium text-zinc-200 text-center">Browse All</a>
              </form>
            </div>

            <div class="lg:col-span-5 bg-bg border border-border rounded p-5 space-y-4">
              <div class="flex items-center justify-between text-xs font-mono text-zinc-400 border-b border-border pb-3">
                <span>KAVEXRO STATUS</span>
                <span class="text-emerald-400">ONLINE</span>
              </div>
              <div class="grid grid-cols-2 gap-3 font-mono tabular">
                <div class="p-3 rounded bg-surface border border-border">
                  <div class="text-xs text-zinc-500">ACTIVE LISTINGS</div>
                  <div class="text-xl font-semibold text-white mt-1">${available.length}</div>
                </div>
                <div class="p-3 rounded bg-surface border border-border">
                  <div class="text-xs text-zinc-500">FEATURED STOCK</div>
                  <div class="text-xl font-semibold text-white mt-1">${featured.length}</div>
                </div>
              </div>
              <div class="pt-1 flex items-center justify-between text-xs text-zinc-400">
                <span>Store owner? Add listings via Admin Panel.</span>
                <a href="#/admin" class="text-accent hover:underline font-mono">Open Admin →</a>
              </div>
            </div>
          </div>
        </section>

        <section class="max-w-7xl mx-auto px-4 sm:px-6 py-12 space-y-12">
          <div>
            <div class="flex items-center justify-between mb-5">
              <h2 class="text-lg font-semibold text-white">Featured Listings</h2>
              <a href="#/marketplace" class="text-xs font-mono text-zinc-400 hover:text-white">VIEW ALL →</a>
            </div>
            ${featured.length
              ? `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">${featured.map(listingCard).join('')}</div>`
              : `<div class="p-8 rounded bg-surface border border-border text-center space-y-2">
                  <p class="text-sm text-zinc-300">No featured listings published yet.</p>
                  <p class="text-xs text-zinc-500">Sign into the <a href="#/admin" class="text-accent underline">Admin Panel</a> with your password to add your first listing.</p>
                 </div>`
            }
          </div>

          <div>
            <div class="flex items-center justify-between mb-5">
              <h2 class="text-lg font-semibold text-white">Recently Added</h2>
              <a href="#/marketplace" class="text-xs font-mono text-zinc-400 hover:text-white">CATALOG →</a>
            </div>
            ${recent.length
              ? `<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">${recent.map(listingCard).join('')}</div>`
              : `<div class="p-8 rounded bg-surface border border-border text-center text-xs text-zinc-500">Catalog is currently blank. Listings you create in Admin appear here right away.</div>`
            }
          </div>
        </section>
      `;
    }

    function renderMarketplace() {
      const f = state.filters;
      let items = [...state.listings];
      if (f.search) {
        const q = f.search.toLowerCase();
        items = items.filter(i => i.title.toLowerCase().includes(q) || i.roblox_username.toLowerCase().includes(q) || i.description.toLowerCase().includes(q));
      }
      if (f.category !== 'All') items = items.filter(i => i.category === f.category);
      if (f.minPrice !== '') items = items.filter(i => i.price >= Number(f.minPrice));
      if (f.maxPrice !== '') items = items.filter(i => i.price <= Number(f.maxPrice));
      if (f.minRobux > 0) items = items.filter(i => i.robux >= Number(f.minRobux));

      if (f.sort === 'price_asc') items.sort((a, b) => a.price - b.price);
      if (f.sort === 'price_desc') items.sort((a, b) => b.price - a.price);
      if (f.sort === 'popular') items.sort((a, b) => b.views - a.views);

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 grid lg:grid-cols-12 gap-8">
          <aside class="lg:col-span-3 space-y-5 bg-surface border border-border rounded p-4 h-fit">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono uppercase text-zinc-400">Filters</span>
              <button onclick="state.filters={search:'',category:'All',minPrice:'',maxPrice:'',minRobux:0,sort:'newest'};router();" class="text-xs text-accent hover:underline">Reset</button>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Keyword</label>
              <input value="${f.search}" oninput="state.filters.search=this.value;router();" placeholder="Search..." class="w-full bg-bg border border-border rounded px-3 py-1.5 text-xs text-white" />
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Category</label>
              <select onchange="state.filters.category=this.value;router();" class="w-full bg-bg border border-border rounded px-3 py-1.5 text-xs text-white">
                ${['All', 'Limiteds', 'Legacy (2006-2014)', 'High Robux', 'Game Stats', 'OG Usernames'].map(c =>
                  `<option value="${c}" ${f.category === c ? 'selected' : ''}>${c}</option>`
                ).join('')}
              </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Min $</label>
                <input type="number" value="${f.minPrice}" oninput="state.filters.minPrice=this.value;router();" class="w-full bg-bg border border-border rounded px-2.5 py-1.5 text-xs text-white" />
              </div>
              <div>
                <label class="block text-xs text-zinc-400 mb-1">Max $</label>
                <input type="number" value="${f.maxPrice}" oninput="state.filters.maxPrice=this.value;router();" class="w-full bg-bg border border-border rounded px-2.5 py-1.5 text-xs text-white" />
              </div>
            </div>
            <div>
              <label class="block text-xs text-zinc-400 mb-1">Min Robux: <span class="font-mono text-white">${Number(f.minRobux).toLocaleString()}</span></label>
              <input type="range" min="0" max="100000" step="1000" value="${f.minRobux}" oninput="state.filters.minRobux=this.value;router();" class="w-full accent-accent" />
            </div>
          </aside>

          <div class="lg:col-span-9 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-3 bg-surface border border-border rounded px-4 py-3">
              <span class="text-xs font-mono text-zinc-400">${items.length} ACCOUNT(S) FOUND</span>
              <select onchange="state.filters.sort=this.value;router();" class="bg-bg border border-border rounded px-3 py-1.5 text-xs text-white">
                <option value="newest" ${f.sort === 'newest' ? 'selected' : ''}>Sort: Newest</option>
                <option value="price_asc" ${f.sort === 'price_asc' ? 'selected' : ''}>Price: Low to High</option>
                <option value="price_desc" ${f.sort === 'price_desc' ? 'selected' : ''}>Price: High to Low</option>
                <option value="popular" ${f.sort === 'popular' ? 'selected' : ''}>Most Viewed</option>
              </select>
            </div>

            ${items.length
              ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${items.map(listingCard).join('')}</div>`
              : `<div class="p-12 bg-surface border border-border rounded text-center space-y-2">
                  <p class="text-sm font-medium text-white">No listings match your criteria</p>
                  <p class="text-xs text-zinc-500">Add new accounts in the password-protected <a href="#/admin" class="text-accent underline">Admin Panel</a> or clear your filters.</p>
                 </div>`
            }
          </div>
        </div>
      `;
    }

    function renderProduct(id) {
      const item = state.listings.find(l => l.id === id);
      if (!item) return `<div class="max-w-3xl mx-auto px-4 py-20 text-center text-zinc-400">Listing not found. <a href="#/marketplace" class="text-accent underline">Back to catalog</a></div>`;

      return `
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-10 grid lg:grid-cols-12 gap-8">
          <div class="lg:col-span-5 bg-surface border border-border rounded overflow-hidden">
            <div class="h-80 bg-elevated border-b border-border">${renderAvatarSVG(item.avatar_preset, item.id)}</div>
            <div class="p-4 grid grid-cols-2 gap-3 font-mono text-xs tabular">
              <div class="p-2.5 bg-bg border border-border rounded"><span class="text-zinc-500 block">JOIN YEAR</span><span class="text-white">${item.join_year}</span></div>

    async function handleAuth(e, mode) {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      try {
        const res = await api(`/api/auth/${mode}`, { method: 'POST', body: JSON.stringify(body) });
        state.userToken = res.token;
        state.user = res.user;
        localStorage.setItem('kvx_user_token', res.token);
        toast(`Welcome, ${res.user.username}`);
        location.hash = '#/dashboard';
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    function renderCart() {
      const items = state.listings.filter(l => state.cart.includes(l.id) && l.status === 'available');
      const total = items.reduce((s, i) => s + Number(i.price), 0);
      return `
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-10 space-y-6">

    async function checkoutCart() {
      if (!state.user) {
        toast('Please sign in first to complete checkout', 'error');
        location.hash = '#/login';
        return;
      }
      try {
        const order = await api('/api/orders', { method: 'POST', body: JSON.stringify({ listingIds: state.cart }) });
        state.cart = [];
        saveLocal();
        await loadListings();
        toast(`Order ${order.id} saved!`);
        location.hash = '#/dashboard';
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function unlockAdmin(e) {
      e.preventDefault();
      const { password } = Object.fromEntries(new FormData(e.target).entries());
      try {
        const res = await api('/api/admin/unlock', { method: 'POST', body: JSON.stringify({ password }) });
        state.adminToken = res.adminToken;
        sessionStorage.setItem('kvx_admin_token', res.adminToken);
        toast('Admin Panel unlocked');
        router();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function createAdminListing(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = Object.fromEntries(fd.entries());
      body.featured = fd.get('featured') === 'on';
      try {
        await api('/api/admin/listings', { method: 'POST', body: JSON.stringify(body) });
        await loadListings();
        toast('Listing saved!');
        e.target.reset();
        router();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function toggleAdminFeature(id, featured) {
      try {
        await api(`/api/admin/listings/${id}`, { method: 'PATCH', body: JSON.stringify({ featured }) });
        await loadListings();
        toast('Featured status updated');
        router();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function deleteAdminListing(id) {
      try {
        await api(`/api/admin/listings/${id}`, { method: 'DELETE' });
        await loadListings();
        toast('Listing deleted');
        router();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function router() {
      renderNav();
      const app = document.getElementById('app');
      const hash = location.hash || '#/';
      const [, route, param] = hash.split('/');

      if (!route || route === '') app.innerHTML = renderHome();
      else if (route === 'marketplace') app.innerHTML = renderMarketplace();
      else if (route === 'product') app.innerHTML = renderProduct(param);
      else if (route === 'login') app.innerHTML = renderAuth('login');
      else if (route === 'register') app.innerHTML = renderAuth('register');
      else if (route === 'dashboard') app.innerHTML = await renderDashboard();
      else if (route === 'favorites') app.innerHTML = renderFavorites();
      else if (route === 'cart') app.innerHTML = renderCart();
      else if (route === 'faq') app.innerHTML = renderFAQ();
      else if (route === 'support') app.innerHTML = renderSupport();
      else if (route === 'admin') app.innerHTML = await renderAdmin();
      else app.innerHTML = renderHome();

      lucide.createIcons();
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', async () => {
      await Promise.all([loadListings(), loadSession()]);
      router();
    });
  </script>
</body>
</html>
